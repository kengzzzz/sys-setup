x-llama-build-args: &llama-build-args
  BASE_CUDA_DEV_CONTAINER: nvidia/cuda@sha256:5626a7d0ecafe3e7c115a452f6b05f20f214f8509346196a7835b205dc5b7fd9 # nvidia/cuda version: 13.4.3-devel-ubuntu24.04
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp.git
  LLAMA_CPP_COMMIT: 1a0b56cec73dac938e0602c974b21dc8e2862830
  CUDA_ARCH: 120a-real
  CUDA_COMPRESSION_MODE: speed
  GGML_CUDA_FA_QUANTS: q4_0-q4_0;q8_0-q8_0;f16-f16

x-model-volume: &model-volume
  type: bind
  source: ./models
  target: /models

x-llama-service: &llama-service
  build:
    context: .
    dockerfile: Dockerfile
    args: *llama-build-args
  env_file:
    - ${LLAMA_ENV_FILE:-.env}
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  gpus: all
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  working_dir: /models
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    HOME: /models/home
    XDG_CACHE_HOME: /models/.cache
    HF_HOME: /models/hf-home
    HUGGINGFACE_HUB_CACHE: /models/hf-home/hub
    SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  volumes:
    - *model-volume

x-tailscale-image: &tailscale-image
  ghcr.io/tailscale/tailscale@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d # stable 2026-10-20

x-tailscale-volume: &tailscale-volume
  type: bind
  source: ./tailscale/state
  target: /var/lib/tailscale

services:
  tailscale:
    image: *tailscale-image
    container_name: tailscale
    hostname: llama-server
    env_file:
      - ${LLAMA_ENV_FILE:-.env}
    environment:
      TS_ACCEPT_DNS: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - *tailscale-volume
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LLAMA_ARG_PORT:-8080}:${LLAMA_ARG_PORT:-8080}"

  llama-server:
    <<: *llama-service
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args: *llama-build-args
    image: llama-server
    container_name: llama-server
    # no env equivalent; above 0.1, resuming a session after another one restores
    # it from the host prompt cache instead of re-prefilling everything past the shared prefix
    command: ["--slot-prompt-similarity", "0.5"]
    depends_on:
      - tailscale
    network_mode: service:tailscale
