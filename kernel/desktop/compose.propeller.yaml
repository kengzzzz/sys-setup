x-build-args: &build-args
  ARCH_IMAGE_DIGEST: ${ARCH_IMAGE_DIGEST:?set ARCH_IMAGE_DIGEST}
  CACHYOS_REPO_FLAVOR: ${CACHYOS_REPO_FLAVOR:-auto}
  KERNEL_GIT_REMOTE: ${KERNEL_GIT_REMOTE:?set KERNEL_GIT_REMOTE}
  KERNEL_REF: ${KERNEL_REF:?set KERNEL_REF}
  KERNEL_SOURCE_SUBDIR: ${KERNEL_SOURCE_SUBDIR:?set KERNEL_SOURCE_SUBDIR}

services:
  kernel-propeller:
    network_mode: host
    environment:
      KERNEL_SOURCE_SUBDIR: ${KERNEL_SOURCE_SUBDIR:?set KERNEL_SOURCE_SUBDIR}
    tmpfs:
      - /build:rw,exec,size=${BUILD_TMPFS_SIZE:-64G},mode=1777
    build:
      context: ..
      dockerfile: desktop/Dockerfile
      target: kernel-toolchain
      args:
        <<: *build-args
        PATCH_FILE: propeller.patch
    image: desktop-kernel-propeller
    volumes:
      - ./scripts:/scripts:ro
      - ./out:/out
    command: [bash, /scripts/build-kernel.sh, propeller]

  propeller:
    privileged: true
    pid: host
    tmpfs:
      - /build:rw,exec,size=${BUILD_TMPFS_SIZE:-64G},mode=1777
    build:
      context: ..
      dockerfile: desktop/Dockerfile.propeller
      target: propeller-profiler
      args:
        ARCH_IMAGE_DIGEST: ${ARCH_IMAGE_DIGEST:?set ARCH_IMAGE_DIGEST}
        CACHYOS_REPO_FLAVOR: ${CACHYOS_REPO_FLAVOR:-auto}
        UBUNTU_IMAGE_DIGEST: ${UBUNTU_IMAGE_DIGEST:?set UBUNTU_IMAGE_DIGEST}
        PROPELLER_REF: ${PROPELLER_REF:?set PROPELLER_REF}
        LLVM_GPG_FINGERPRINT: ${LLVM_GPG_FINGERPRINT:?set LLVM_GPG_FINGERPRINT}
    image: desktop-propeller
    volumes:
      - ./scripts:/scripts:ro
      - ./profiles:/profiles
      - ./out:/out:ro
    command: [bash, /scripts/generate-propeller-profile.sh]
